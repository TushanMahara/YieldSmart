<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YieldSmart Crop Yield Predictor</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- 🌌 Background -->
  <div id="three-container"></div>
  <div id="bg-image"></div>

  <!-- 📦 Main UI -->
  <div class="container">
    <div class="content-overlay">

      <!-- 🔝 Header -->
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h1 data-i18n="title_predict">🌱 YieldSmart Crop Yield Prediction</h1>

        <select id="langSelect" aria-label="Language selector">
          <option value="en">EN</option>
          <option value="hi">HI</option>
        </select>
      </div>

      <!-- 📋 Form -->
      <form id="predictForm" autocomplete="off">

        <label>
          <span data-i18n="cropType">Crop Type</span>
          <input type="text" name="Crop_Type" placeholder="e.g. rice" required />
        </label>

        <label>
          <span data-i18n="soilType">Soil Type</span>
          <select name="Soil_Type" required>
            <option value="">-- Select Soil Type --</option>
            <option value="Peaty">Peaty</option>
            <option value="Loamy">Loamy</option>
            <option value="Sandy">Sandy</option>
            <option value="Saline">Saline</option>
            <option value="Clay">Clay</option>
          </select>
        </label>

        <label>
          <span data-i18n="nLabel">N (Nitrogen)</span>
          <input type="number" name="N" step="0.01" required />
        </label>

        <label>
          <span data-i18n="pLabel">P (Phosphorus)</span>
          <input type="number" name="P" step="0.01" required />
        </label>

        <label>
          <span data-i18n="kLabel">K (Potassium)</span>
          <input type="number" name="K" step="0.01" required />
        </label>

        <label>
          <span data-i18n="locationLabel">Location (City)</span>
          <input type="text" id="locationInput" name="Location" placeholder="e.g. Kolkata" required />
        </label>

        <button id="submitButton" type="submit" data-i18n="predictButton">
          Predict Yield
        </button>

      </form>

      <!-- 📊 Status -->
      <div id="status" data-i18n="status_default">
        Enter details and click Predict Yield.
      </div>

      <!-- ⏳ Loader -->
      <div id="loader"></div>

      <!-- 📈 Result -->
      <div id="result"></div>

      <!-- 🔗 Link to Fertilizer Recommendation -->
      <a id="fertLink" class="btn" href="http://localhost:5001/" data-i18n="link_fertiliser">
        Click here to get Fertiliser recommendation
      </a>

    </div>
  </div>

  <!-- ⚙️ Scripts -->
  <script type="module">
    import { init } from './i18n.js';
    import { ThreeBG } from './three.js';

    init('en');

    window.addEventListener('load', () => {
      const threeBG = new ThreeBG('three-container');
      window.addEventListener('resize', () => threeBG.handleResize());
    });

    import('./script.js');
  </script>

</body>
</html>
